name: Deploy readable EPG URLs

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"
  workflow_run:
    workflows: [Update Germany EPG, Update USA EPG]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Complete the atomic deployment. Each queued run selects both producers afresh.
concurrency:
  group: epg-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout verifier at this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify producer provenance, hashes and combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_release.py --output build/pages --workspace build/producer-artifacts
      - name: Verify exact nine Pages artifacts including required logos
        run: |
          python scripts/audit_all_epg_products.py \
            --directory build/pages --layout pages --usa-logo-debt config/usa-logo-debt-policy.json --report build/pages-quality.json
      - name: Verify every live logo URL in the prospective Pages bytes
        run: |
          python scripts/audit_logo_reachability.py \
            --directory build/pages --layout pages --usa-logo-debt config/usa-logo-debt-policy.json --report build/pages-logo-reachability.json
      - name: Preserve independent Pages logo quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-logo-quality-${{ github.run_id }}
          path: |
            build/pages-quality.json
            build/pages-logo-reachability.json
          if-no-files-found: warn
          retention-days: 90
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload exact audited Pages tree
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public release bytes and retired URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_deployed_release.py --source build/pages --url "$PAGE_URL" --report build/public-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-release-verification-${{ github.run_id }}
          path: build/public-verification.json
          if-no-files-found: error
          retention-days: 90
