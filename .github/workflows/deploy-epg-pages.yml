name: Deploy readable EPG URLs

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"
  workflow_run:
    workflows: [Update Germany EPG, Update USA EPG]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Complete the atomic deployment. Each queued run selects both producers afresh.
concurrency:
  group: epg-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verifier at this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify producer provenance, hashes and combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_release.py --output build/pages --workspace build/producer-artifacts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload exact audited Pages tree
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
