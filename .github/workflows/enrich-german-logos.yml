name: Enrich German EPG Logos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enrich-german-logos.yml"
      - "scripts/enrich_published_logos.py"
  workflow_run:
    workflows:
      - "Update Germany EPG"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: epg-de-logo-enrichment-v1
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch current logo database
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/logo-database
          git clone --depth 1 https://github.com/iptv-org/database.git upstream/logo-database

      - name: Enrich missing logos without changing EPG identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python scripts/enrich_published_logos.py \
            --logos-csv upstream/logo-database/data/logos.csv \
            --channels-csv upstream/logo-database/data/channels.csv \
            --master epg/de.xml.gz \
            --samsung epg/samsung.xml.gz \
            --pluto epg/pluto.xml.gz \
            --amazon epg/amazon.xml.gz \
            --amazon-report reports/amazon-coverage.csv \
            --report reports/logo-coverage.csv

      - name: Publish enriched logo files safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "epg-de bot"
          git config user.email "actions@users.noreply.github.com"

          start_de_sha="$(git show HEAD:epg/de.xml.gz | git hash-object --stdin)"
          publish_tmp="$(mktemp -d)"
          trap 'rm -rf "$publish_tmp"' EXIT

          cp epg/de.xml.gz "$publish_tmp/de.xml.gz"
          cp epg/samsung.xml.gz "$publish_tmp/samsung.xml.gz"
          cp epg/pluto.xml.gz "$publish_tmp/pluto.xml.gz"
          cp epg/amazon.xml.gz "$publish_tmp/amazon.xml.gz"
          cp reports/logo-coverage.csv "$publish_tmp/logo-coverage.csv"

          for attempt in 1 2 3; do
            echo "Logo publish attempt $attempt/3"
            git fetch origin main --depth=1
            remote_de_sha="$(git show origin/main:epg/de.xml.gz | git hash-object --stdin)"

            if [[ "$remote_de_sha" != "$start_de_sha" ]]; then
              echo "A newer Germany EPG was published while logo enrichment was running."
              echo "This run is superseded; the next logo workflow will process the newer guide."
              exit 0
            fi

            git reset --hard origin/main
            mkdir -p epg reports
            cp "$publish_tmp/de.xml.gz" epg/de.xml.gz
            cp "$publish_tmp/samsung.xml.gz" epg/samsung.xml.gz
            cp "$publish_tmp/pluto.xml.gz" epg/pluto.xml.gz
            cp "$publish_tmp/amazon.xml.gz" epg/amazon.xml.gz
            cp "$publish_tmp/logo-coverage.csv" reports/logo-coverage.csv

            git add -A -- \
              epg/de.xml.gz \
              epg/samsung.xml.gz \
              epg/pluto.xml.gz \
              epg/amazon.xml.gz \
              reports/logo-coverage.csv

            if git diff --cached --quiet; then
              echo "No logo changes to publish."
              exit 0
            fi

            git commit -m "chore: enrich German EPG logos"
            if git push origin HEAD:main; then
              echo "German EPG logo publication succeeded."
              exit 0
            fi

            echo "Remote main moved during logo publication; retrying."
          done

          echo "German EPG logo publication failed after 3 attempts."
          exit 1
