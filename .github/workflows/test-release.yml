name: Release regression tests
on:
  pull_request:
  push:
    branches: [main, codex/validated-provider-release]
    paths: ["scripts/**", "config/**", "tests/**", ".github/workflows/**"]
permissions:
  contents: read
  actions: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
  production-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inventory prohibited identities in committed EPG files
        run: python scripts/audit_committed_pseudo_ids.py --report build/pseudo-identity-inventory.json
      - name: Upload source inventory even when it blocks release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committed-epg-pseudo-identity-inventory
          path: build/pseudo-identity-inventory.json
          if-no-files-found: error
      - name: Reconcile and audit the proposed release from the pinned snapshot
        run: python scripts/validate_release_snapshot.py --output build/snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: epg-test-de-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/snapshot/bundle-DE/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: epg-test-usa-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/snapshot/bundle-USA/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-snapshot-evidence
          path: |
            build/snapshot/*.json
            build/snapshot/DE/*.json
            build/snapshot/DE/*.jsonl
            build/snapshot/USA/*.json
            build/snapshot/USA/*.jsonl
          if-no-files-found: warn

  usa-rebuild-diagnostics:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download current upstream USA metadata and playlists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/usa/input/fast build/usa/output build/usa/work
          curl --retry 3 --connect-timeout 15 --max-time 120 -fsSL https://raw.githubusercontent.com/iptv-org/database/master/data/channels.csv -o build/usa/input/channels.csv
          curl --retry 3 --connect-timeout 15 --max-time 120 -fsSL https://raw.githubusercontent.com/iptv-org/database/master/data/logos.csv -o build/usa/input/logos.csv
          curl --retry 3 --connect-timeout 15 --max-time 120 -fsSL https://iptv-org.github.io/iptv/countries/us.m3u -o build/usa/input/us.m3u
          for name in us_pluto us_samsung us_plex us_roku us_xumo; do
            curl --retry 2 --connect-timeout 10 --max-time 60 -fsSL "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/${name}.m3u" -o "build/usa/input/fast/${name}.m3u" || rm -f "build/usa/input/fast/${name}.m3u"
          done
      - name: Rebuild USA guides from upstream without touching committed feeds
        run: |
          python scripts/build_us_epgs.py \
            --channels-csv build/usa/input/channels.csv \
            --logos-csv build/usa/input/logos.csv \
            --country-playlist build/usa/input/us.m3u \
            --national-patterns config/us-national-patterns.txt \
            --fast-playlist-dir build/usa/input/fast \
            --config config/us-epg.json \
            --output-dir build/usa/output \
            --report build/usa/usa-coverage.csv \
            --mapping-report build/usa/usa-channel-mapping.csv \
            --unmapped-report build/usa/usa-unmapped-channels.csv \
            --work-dir build/usa/work
      - name: Validate rebuilt USA identity and XMLTV integrity
        run: |
          python scripts/normalize_tivimate_xmltv.py --coverage build/usa/usa-coverage.csv build/usa/output/usa.xml build/usa/output/usa-sports.xml build/usa/output/usa-local.xml build/usa/output/usa-fast.xml
          python scripts/reconcile_release.py --region USA --source build/usa/output --output build/usa/reconciled --mapping build/usa/usa-channel-mapping.csv
          cp build/usa/reconciled/usa-coverage.csv build/usa/usa-coverage.csv
          cp build/usa/reconciled/usa-channel-mapping.csv build/usa/usa-channel-mapping.csv
      - name: Validate rebuilt USA candidate against committed Last Known Good
        shell: bash
        run: |
          set -euo pipefail
          for spec in "usa 100 5000" "usa-local 1000 100000" "usa-fast 100 5000" "usa-sports 100 5000"; do
            read -r stem min_channels min_programmes <<< "$spec"
            args=(
              "build/usa/reconciled/${stem}.xml"
              --gzip "build/usa/reconciled/${stem}.xml.gz"
              --min-channels "$min_channels"
              --min-programmes "$min_programmes"
              --require-display-names
              --require-programme-titles
              --reject-empty-icons
              --skip-pre-validation-cleanup
            )
            python scripts/validate_epg.py "${args[@]}"
          done
          python scripts/audit_usa_epgs.py \
            --main build/usa/reconciled/usa.xml \
            --sports build/usa/reconciled/usa-sports.xml \
            --local build/usa/reconciled/usa-local.xml \
            --fast build/usa/reconciled/usa-fast.xml \
            --coverage build/usa/usa-coverage.csv \
            --mapping build/usa/usa-channel-mapping.csv \
            --playlist build/usa/input/us.m3u \
            --summary build/usa/usa-quality-audit.json \
            --min-playlist-mapped 400
          python scripts/release_bundle.py --test-build --region USA \
            --source build/usa/reconciled --output build/usa/release-candidate \
            --mapping build/usa/usa-channel-mapping.csv
      - name: Upload validated USA candidate for promotion review
        uses: actions/upload-artifact@v4
        with:
          name: usa-validated-candidate
          path: build/usa/release-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve rebuilt USA evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usa-rebuild-diagnostics
          path: |
            build/usa/*.csv
            build/usa/reconciled/*.json
            build/usa/reconciled/*.jsonl
            build/usa/output/*.rejected.jsonl
          if-no-files-found: warn
          retention-days: 30
  artifact-roundtrip:
    if: github.event_name == 'push'
    needs: [tests, production-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download exact GitHub artifacts and exercise the Pages verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage_release.py --snapshot-run ${{ github.run_id }} --output build/pages --workspace build/downloaded
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pages-snapshot
          path: build/pages/
          if-no-files-found: error
          compression-level: 0
