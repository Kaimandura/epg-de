name: Update Germany EPG

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build profile"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - deep
  schedule:
    - cron: "17 2 * * *"
    - cron: "47 3 * * 0"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-epg.yml"
      - "scripts/**"
      - "config/**"

permissions:
  contents: write

concurrency:
  group: epg-de-update-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select build profile
        id: profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          mode="fast"
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "47 3 * * 0" ]]; then
            mode="deep"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_MODE" == "deep" ]]; then
            mode="deep"
          fi

          if [[ "$mode" == "deep" ]]; then
            rounds=6
            workers=4
            batch_size=30
            grab_timeout=420
            overall_timeout=12600
          else
            rounds=3
            workers=3
            batch_size=40
            grab_timeout=180
            overall_timeout=5400
          fi

          {
            echo "mode=$mode"
            echo "rounds=$rounds"
            echo "workers=$workers"
            echo "batch_size=$batch_size"
            echo "grab_timeout=$grab_timeout"
            echo "overall_timeout=$overall_timeout"
          } >> "$GITHUB_OUTPUT"

          echo "Build profile: $mode"
          echo "rounds=$rounds workers=$workers batch_size=$batch_size grab_timeout=${grab_timeout}s overall_timeout=${overall_timeout}s"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch current iptv-org sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream build
          mkdir -p upstream build/publish data epg reports
          git clone --depth 1 https://github.com/iptv-org/epg.git upstream/epg
          git clone --depth 1 https://github.com/iptv-org/database.git upstream/database
          curl --retry 3 --connect-timeout 15 --max-time 60 -fsSL \
            https://iptv-org.github.io/iptv/countries/de.m3u \
            -o upstream/de.m3u || true

      - name: Install epg grabber
        working-directory: upstream/epg
        run: npm ci

      - name: Collect German and Germany-available channels
        run: |
          python scripts/collect_channels.py \
            --epg-root upstream/epg \
            --feeds-csv upstream/database/data/feeds.csv \
            --playlist upstream/de.m3u \
            --priority-file config/source-priority.txt \
            --override-file config/channel-overrides.json \
            --unmapped-report build/unmapped-de-channels.csv \
            --candidates build/candidates.json \
            --channels data/de-channels.xml

      - name: Build staged guide with bounded parallel fallback
        run: |
          python scripts/build_epg.py \
            --epg-root upstream/epg \
            --candidates build/candidates.json \
            --output build/publish/de.xml \
            --coverage build/publish/coverage.csv \
            --days 7 \
            --rounds "${{ steps.profile.outputs.rounds }}" \
            --min-programmes 4 \
            --workers "${{ steps.profile.outputs.workers }}" \
            --batch-size "${{ steps.profile.outputs.batch_size }}" \
            --grab-timeout-seconds "${{ steps.profile.outputs.grab_timeout }}" \
            --overall-timeout-seconds "${{ steps.profile.outputs.overall_timeout }}"

      - name: Validate staged XMLTV and Last Known Good
        shell: bash
        run: |
          set -euo pipefail
          args=(
            build/publish/de.xml
            --gzip build/publish/de.xml.gz
            --min-channels 25
            --min-programmes 100
          )

          baseline=""
          if [[ -f epg/de.xml ]]; then
            baseline="epg/de.xml"
          elif [[ -f epg/de.xml.gz ]]; then
            mkdir -p build/baseline
            gzip -dc epg/de.xml.gz > build/baseline/de.xml
            baseline="build/baseline/de.xml"
          fi

          if [[ -n "$baseline" ]]; then
            args+=(
              --baseline "$baseline"
              --min-baseline-programme-ratio 0.60
              --min-baseline-active-channel-ratio 0.70
            )
          fi

          python scripts/validate_epg.py "${args[@]}"

      - name: Export platform EPG subsets
        run: |
          python scripts/export_platform_epgs.py \
            --master build/publish/de.xml \
            --candidates build/candidates.json \
            --config config/platforms.json \
            --output-dir build/publish/platforms \
            --report build/publish/platform-coverage.csv

      - name: Promote validated build (Last Known Good)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p epg reports
          rm -f epg/de.xml epg/samsung.xml epg/pluto.xml epg/amazon.xml
          cp build/publish/de.xml.gz epg/de.xml.gz
          cp build/publish/platforms/samsung.xml.gz epg/samsung.xml.gz
          cp build/publish/platforms/pluto.xml.gz epg/pluto.xml.gz
          cp build/publish/platforms/amazon.xml.gz epg/amazon.xml.gz
          cp build/publish/coverage.csv reports/coverage.csv
          cp build/publish/platform-coverage.csv reports/platform-coverage.csv
          cp build/unmapped-de-channels.csv reports/unmapped-de-channels.csv

      - name: Publish generated files
        shell: bash
        env:
          START_SHA: ${{ github.sha }}
          BUILD_MODE: ${{ steps.profile.outputs.mode }}
        run: |
          set -euo pipefail

          git config user.name "epg-de bot"
          git config user.email "actions@users.noreply.github.com"

          publish_tmp="$(mktemp -d)"
          trap 'rm -rf "$publish_tmp"' EXIT

          cp data/de-channels.xml "$publish_tmp/de-channels.xml"
          cp epg/de.xml.gz "$publish_tmp/de.xml.gz"
          cp epg/samsung.xml.gz "$publish_tmp/samsung.xml.gz"
          cp epg/pluto.xml.gz "$publish_tmp/pluto.xml.gz"
          cp epg/amazon.xml.gz "$publish_tmp/amazon.xml.gz"
          cp reports/coverage.csv "$publish_tmp/coverage.csv"
          cp reports/platform-coverage.csv "$publish_tmp/platform-coverage.csv"
          cp reports/unmapped-de-channels.csv "$publish_tmp/unmapped-de-channels.csv"

          for file in \
            "$publish_tmp/de-channels.xml" \
            "$publish_tmp/de.xml.gz" \
            "$publish_tmp/samsung.xml.gz" \
            "$publish_tmp/pluto.xml.gz" \
            "$publish_tmp/amazon.xml.gz" \
            "$publish_tmp/coverage.csv" \
            "$publish_tmp/platform-coverage.csv" \
            "$publish_tmp/unmapped-de-channels.csv"; do
            size="$(stat -c%s "$file")"
            if (( size >= 100 * 1024 * 1024 )); then
              echo "Refusing publication: $file is ${size} bytes and exceeds GitHub's 100 MiB limit."
              exit 1
            fi
          done

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"
            git fetch origin main --depth=1
            remote_sha="$(git rev-parse origin/main)"

            if [[ "$remote_sha" != "$START_SHA" ]]; then
              pipeline_changes="$(
                git diff --name-only "$START_SHA" "$remote_sha" -- \
                  .github/workflows/update-epg.yml scripts config || true
              )"
              if [[ -n "$pipeline_changes" ]]; then
                echo "A newer pipeline/config revision is already on main:"
                echo "$pipeline_changes"
                echo "This build is superseded; keeping the current Last Known Good publication."
                exit 0
              fi
            fi

            git reset --hard "$remote_sha"
            mkdir -p data epg reports
            rm -f epg/de.xml epg/samsung.xml epg/pluto.xml epg/amazon.xml
            cp "$publish_tmp/de-channels.xml" data/de-channels.xml
            cp "$publish_tmp/de.xml.gz" epg/de.xml.gz
            cp "$publish_tmp/samsung.xml.gz" epg/samsung.xml.gz
            cp "$publish_tmp/pluto.xml.gz" epg/pluto.xml.gz
            cp "$publish_tmp/amazon.xml.gz" epg/amazon.xml.gz
            cp "$publish_tmp/coverage.csv" reports/coverage.csv
            cp "$publish_tmp/platform-coverage.csv" reports/platform-coverage.csv
            cp "$publish_tmp/unmapped-de-channels.csv" reports/unmapped-de-channels.csv

            git add -A -- \
              data/de-channels.xml \
              epg/de.xml.gz \
              epg/samsung.xml.gz \
              epg/pluto.xml.gz \
              epg/amazon.xml.gz \
              reports/coverage.csv \
              reports/platform-coverage.csv \
              reports/unmapped-de-channels.csv

            if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
            fi

            git commit -m "chore: update Germany EPG ($BUILD_MODE)"
            if git push origin HEAD:main; then
              echo "Publication succeeded."
              exit 0
            fi

            echo "Remote main moved during publication; retrying safely."
          done

          echo "Publication failed after 3 race-safe attempts."
          exit 1
